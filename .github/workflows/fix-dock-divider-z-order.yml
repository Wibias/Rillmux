name: Fix Dock Divider Z Order

on:
  push:
    branches:
      - fix/dock-divider-z-order

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dock-divider-z-order
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target

      - name: Add regression contract first
        shell: bash
        run: |
          cat > src-tauri/tests/dock_grip_zorder_contract.rs <<'EOF'
          #[test]
          fn regular_dock_grips_never_enter_global_topmost_band() {
              let dock = include_str!("../src/dock.rs");
              let streaming = include_str!("../src/streaming/dock.rs");

              assert!(
                  !dock.contains("DockCmd::ElevateGrips"),
                  "regular dock grips must never enter the global TOPMOST band"
              );
              assert!(
                  !dock.contains("DockCmd::DemoteGrips"),
                  "divider stacking must not depend on focus-driven TOPMOST demotion"
              );
              assert!(
                  !dock.contains("GRIPS_ELEVATED"),
                  "regular grip placement must not carry global TOPMOST state"
              );
              assert!(
                  !dock.contains("HWND_TOPMOST as *mut core::ffi::c_void"),
                  "regular grips must never be promoted with HWND_TOPMOST"
              );
              assert!(dock.contains("RestackGrips(isize)"));
              assert!(dock.contains("restack_grips_inner(anchor: isize)"));
              assert!(dock.contains("GetWindow(anchor, GW_HWNDPREV)"));
              assert!(streaming.contains("topmost_dock_member(&hwnds)"));
              assert!(streaming.contains("crate::dock::restack_grips_above(anchor as isize)"));
          }

          #[test]
          fn monitor_identify_overlay_remains_the_only_permanent_topmost_grip() {
              let dock = include_str!("../src/dock.rs");
              assert!(dock.contains("if is_identify { WS_EX_TOPMOST } else { 0 }"));
          }
          EOF

      - name: Verify regression contract is RED
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --manifest-path src-tauri/Cargo.toml --test dock_grip_zorder_contract 2>&1 | Tee-Object -FilePath red.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw 'Regression contract unexpectedly passed before the implementation.'
          }
          if (-not (Select-String -Path red.log -Pattern 'regular dock grips must never enter the global TOPMOST band' -Quiet)) {
            Get-Content red.log
            throw 'Regression contract failed for an unexpected reason.'
          }
          exit 0

      - name: Replace global TOPMOST with dock-relative restacking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          dock_path = Path("src-tauri/src/dock.rs")
          dock = dock_path.read_text(encoding="utf-8")

          dock = replace_once(
              dock,
              '''    /// Temporarily TOPMOST so grips sit above mpv/chat (dock group focused).\n    ElevateGrips,\n    /// Drop TOPMOST so other apps can cover the dock (including grey bars).\n    DemoteGrips,\n''',
              '''    /// Restack regular grips immediately above the topmost dock member without\n    /// entering Windows' global TOPMOST band.\n    RestackGrips(isize),\n''',
              "DockCmd z-order variants",
          )

          dock = replace_once(
              dock,
              '''        // Coalesce z-order spam from the 100ms watchdog.\n        match cmd {\n            DockCmd::ElevateGrips => {\n                q.retain(|c| !matches!(c, DockCmd::ElevateGrips | DockCmd::DemoteGrips));\n            }\n            DockCmd::DemoteGrips => {\n                q.retain(|c| !matches!(c, DockCmd::ElevateGrips | DockCmd::DemoteGrips));\n            }\n            _ => {}\n        }\n''',
              '''        // Coalesce z-order spam from the watchdog: only the latest dock anchor matters.\n        if matches!(&cmd, DockCmd::RestackGrips(_)) {\n            q.retain(|c| !matches!(c, DockCmd::RestackGrips(_)));\n        }\n''',
              "command coalescing",
          )

          dock = replace_once(
              dock,
              '''#[cfg(windows)]\nstatic GRIPS_GROUP_MINIMIZED: AtomicBool = AtomicBool::new(false);\n/// When true, grip place/raise uses HWND_TOPMOST so bars stay above mpv/chat.\n#[cfg(windows)]\nstatic GRIPS_ELEVATED: AtomicBool = AtomicBool::new(false);\n''',
              '''#[cfg(windows)]\nstatic GRIPS_GROUP_MINIMIZED: AtomicBool = AtomicBool::new(false);\n''',
              "grip elevation state",
          )

          dock = replace_once(
              dock,
              '''        GRIPS_GROUP_MINIMIZED.store(true, Ordering::SeqCst);\n        GRIPS_ELEVATED.store(false, Ordering::SeqCst);\n        post_cmd(DockCmd::HideGrips);\n''',
              '''        GRIPS_GROUP_MINIMIZED.store(true, Ordering::SeqCst);\n        post_cmd(DockCmd::HideGrips);\n''',
              "hide grip elevation state",
          )

          pattern = re.compile(
              r'''/// Put grips above mpv/Chatterino \(TOPMOST\) while the dock group is focused\.\npub fn raise_grips\(\) \{.*?/// True when `hwnd` is one of our dock grip windows''',
              re.S,
          )
          replacement = '''/// Keep regular dock grips directly above the topmost mpv/owned Chatterino\n/// window in the normal Z-order. They must never enter the global TOPMOST band.\npub fn restack_grips_above(anchor: isize) {\n    #[cfg(windows)]\n    {\n        if anchor == 0 || GRIPS_GROUP_MINIMIZED.load(Ordering::SeqCst) {\n            return;\n        }\n        post_cmd(DockCmd::RestackGrips(anchor));\n    }\n    #[cfg(not(windows))]\n    let _ = anchor;\n}\n\n/// True when `hwnd` is one of our dock grip windows'''
          dock, n = pattern.subn(replacement, dock, count=1)
          if n != 1:
              raise SystemExit(f"public z-order API: expected 1 match, found {n}")

          dock = replace_once(
              dock,
              '''    // Regular grips are not permanently TOPMOST. ElevateGrips / DemoteGrips\n    // toggle TOPMOST while the dock group is focused so bars stay above mpv\n    // without covering unrelated apps.\n''',
              '''    // Regular grips always stay in the normal Z-order. Only the brief monitor\n    // identify overlays are TOPMOST.\n''',
              "topmost constants comment",
          )
          dock = replace_once(
              dock,
              '''    const WS_EX_TOPMOST: u32 = 0x0000_0008;\n    const HWND_TOPMOST: isize = -1;\n    const HWND_NOTOPMOST: isize = -2;\n''',
              '''    const WS_EX_TOPMOST: u32 = 0x0000_0008;\n    const HWND_NOTOPMOST: isize = -2;\n''',
              "HWND topmost constants",
          )

          dock = replace_once(
              dock,
              '''        fn GetWindowLongPtrW(hwnd: *mut core::ffi::c_void, index: i32) -> isize;\n''',
              '''        fn GetWindowLongPtrW(hwnd: *mut core::ffi::c_void, index: i32) -> isize;\n        fn GetWindow(hwnd: *mut core::ffi::c_void, cmd: u32) -> *mut core::ffi::c_void;\n        fn IsWindow(hwnd: *mut core::ffi::c_void) -> i32;\n''',
              "Win32 z-order imports",
          )
          dock = replace_once(
              dock,
              '''    const GWLP_USERDATA: i32 = -21;\n''',
              '''    const GWL_EXSTYLE: i32 = -20;\n    const GWLP_USERDATA: i32 = -21;\n    const GW_HWNDPREV: u32 = 3;\n''',
              "Win32 z-order constants",
          )

          pattern = re.compile(
              r'''    unsafe fn place_grip\(hwnd: \*mut core::ffi::c_void, r: Rect\) \{.*?\n    \}\n\n    fn grip_hwnds_for_zorder''',
              re.S,
          )
          replacement = '''    unsafe fn place_grip(hwnd: *mut core::ffi::c_void, r: Rect) {\n        if hwnd.is_null() {\n            return;\n        }\n        // Geometry updates never change the grip's Z-order. The streaming\n        // watchdog restacks the whole grip set relative to the dock members.\n        SetWindowPos(\n            hwnd,\n            std::ptr::null_mut(),\n            r.left,\n            r.top,\n            r.width().max(4),\n            r.height().max(4),\n            SWP_NOACTIVATE | SWP_NOZORDER | SWP_SHOWWINDOW,\n        );\n    }\n\n    fn grip_hwnds_for_zorder'''
          dock, n = pattern.subn(replacement, dock, count=1)
          if n != 1:
              raise SystemExit(f"place_grip: expected 1 match, found {n}")

          pattern = re.compile(
              r'''    unsafe fn elevate_grips_inner\(\) \{.*?\n    \}\n\n    unsafe fn demote_grips_inner\(\) \{.*?\n    \}\n\n    fn tile_grip_plan''',
              re.S,
          )
          replacement = '''    unsafe fn restack_grips_inner(anchor: isize) {\n        let anchor = anchor as *mut core::ffi::c_void;\n        if anchor.is_null() || IsWindow(anchor) == 0 {\n            return;\n        }\n        let Ok(g) = grips().lock() else {\n            return;\n        };\n        let hwnds = grip_hwnds_for_zorder(&g);\n        if hwnds.is_empty() {\n            return;\n        }\n\n        // Defensive migration: an older build may have left a regular grip in\n        // the TOPMOST band. Strip that state before doing relative restacking.\n        for &hwnd in &hwnds {\n            if hwnd.is_null() || IsWindow(hwnd) == 0 {\n                continue;\n            }\n            let style = GetWindowLongPtrW(hwnd, GWL_EXSTYLE) as u32;\n            if style & WS_EX_TOPMOST != 0 {\n                SetWindowPos(\n                    hwnd,\n                    HWND_NOTOPMOST as *mut core::ffi::c_void,\n                    0,\n                    0,\n                    0,\n                    0,\n                    SWP_NOMOVE | SWP_NOSIZE | SWP_NOACTIVATE,\n                );\n            }\n        }\n\n        // Insert the grips in the normal band immediately above the topmost\n        // dock member. Skip grips already occupying that gap. If the previous\n        // window is TOPMOST, HWND_TOP (null) means the top of the *normal* band.\n        let mut after = GetWindow(anchor, GW_HWNDPREV);\n        while !after.is_null() && hwnds.contains(&after) {\n            after = GetWindow(after, GW_HWNDPREV);\n        }\n        if !after.is_null() {\n            let style = GetWindowLongPtrW(after, GWL_EXSTYLE) as u32;\n            if style & WS_EX_TOPMOST != 0 {\n                after = std::ptr::null_mut();\n            }\n        }\n        for &hwnd in &hwnds {\n            if hwnd.is_null() || IsWindow(hwnd) == 0 {\n                continue;\n            }\n            SetWindowPos(\n                hwnd,\n                after,\n                0,\n                0,\n                0,\n                0,\n                SWP_NOMOVE | SWP_NOSIZE | SWP_NOACTIVATE | SWP_SHOWWINDOW,\n            );\n        }\n    }\n\n    fn tile_grip_plan'''
          dock, n = pattern.subn(replacement, dock, count=1)
          if n != 1:
              raise SystemExit(f"restack implementation: expected 1 match, found {n}")

          dock = replace_once(
              dock,
              '''                DockCmd::RestoreSeam => restore_seam_grips_inner(),\n                DockCmd::ElevateGrips => unsafe { elevate_grips_inner() },\n                DockCmd::DemoteGrips => unsafe { demote_grips_inner() },\n                DockCmd::PickMonitor => {\n''',
              '''                DockCmd::RestoreSeam => restore_seam_grips_inner(),\n                DockCmd::RestackGrips(anchor) => unsafe { restack_grips_inner(anchor) },\n                DockCmd::PickMonitor => {\n''',
              "command dispatch",
          )

          dock_path.write_text(dock, encoding="utf-8", newline="\n")

          stream_path = Path("src-tauri/src/streaming/dock.rs")
          stream = stream_path.read_text(encoding="utf-8")

          stream = replace_once(
              stream,
              '''        let mut seam_suppressed = false;\n        let mut grips_elevated = false;\n''',
              '''        let mut seam_suppressed = false;\n''',
              "watchdog elevation state",
          )
          stream = replace_once(
              stream,
              '''                if grips_elevated {\n                    crate::dock::demote_grips();\n                    grips_elevated = false;\n                }\n''',
              '''''',
              "inactive demotion",
          )
          stream = replace_once(
              stream,
              '''                group_minimized = true;\n                grips_elevated = false;\n                sleep_ms = dock_watchdog_interval_ms(true, true);\n''',
              '''                group_minimized = true;\n                sleep_ms = dock_watchdog_interval_ms(true, true);\n''',
              "minimize elevation state",
          )
          stream = re.sub(
              r'''\n\s*grips_elevated = true; // Sync elevates; track that here\.\n\s*// Refresh cache from live finds after restore/retile\.''',
              '''\n                    // Refresh cache from live finds after restore/retile.''',
              stream,
              count=1,
          )
          if "grips_elevated" in stream:
              raise SystemExit("stale grips_elevated reference remains")

          old_focus = '''            // Keep grey grips above mpv/chat while the dock owns focus.\n            // Re-assert TOPMOST every tick (mpv --ontop / BringWindowToTop can\n            // reorder the TOPMOST band). Only demote when FG is clearly a\n            // foreign app — never demote on a failed title scan.\n            if cfg.linked {\n                match focus.unwrap_or(DockFocusKind::Unknown) {\n                    DockFocusKind::DockOrApp | DockFocusKind::Unknown => {\n                        // Re-elevate even when already tracked as elevated.\n                        crate::dock::raise_grips();\n                        raise_poll_overlay();\n                        grips_elevated = true;\n                    }\n                    DockFocusKind::Foreign => {\n                        if grips_elevated {\n                            crate::dock::demote_grips();\n                            grips_elevated = false;\n                        }\n                    }\n                }\n            }\n'''
          new_focus = '''            // Keep grey grips in the normal Z-order immediately above the\n            // topmost mpv/owned Chatterino member. Foreign apps therefore cover\n            // the entire dock naturally; no divider enters the TOPMOST band.\n            if cfg.linked {\n                if let Some(anchor) = topmost_dock_member(&hwnds) {\n                    crate::dock::restack_grips_above(anchor as isize);\n                }\n                // Preserve the existing poll-overlay focus behavior separately.\n                if matches!(\n                    focus.unwrap_or(DockFocusKind::Unknown),\n                    DockFocusKind::DockOrApp | DockFocusKind::Unknown\n                ) {\n                    raise_poll_overlay();\n                }\n            }\n'''
          stream = replace_once(stream, old_focus, new_focus, "watchdog z-order block")

          marker = '''#[cfg(windows)]\nfn is_hwnd_alive(hwnd: *mut core::ffi::c_void) -> bool {\n'''
          helper = '''#[cfg(windows)]\nfn topmost_dock_member(\n    members: &[*mut core::ffi::c_void],\n) -> Option<*mut core::ffi::c_void> {\n    #[link(name = "user32")]\n    unsafe extern "system" {\n        fn GetTopWindow(hwnd: *mut core::ffi::c_void) -> *mut core::ffi::c_void;\n        fn GetWindow(hwnd: *mut core::ffi::c_void, cmd: u32) -> *mut core::ffi::c_void;\n    }\n    const GW_HWNDNEXT: u32 = 2;\n    let mut hwnd = unsafe { GetTopWindow(std::ptr::null_mut()) };\n    for _ in 0..4096 {\n        if hwnd.is_null() {\n            break;\n        }\n        if members.contains(&hwnd) && is_hwnd_alive(hwnd) {\n            return Some(hwnd);\n        }\n        hwnd = unsafe { GetWindow(hwnd, GW_HWNDNEXT) };\n    }\n    members.iter().copied().find(|&hwnd| is_hwnd_alive(hwnd))\n}\n\n'''
          stream = replace_once(stream, marker, helper + marker, "topmost dock member helper")
          stream_path.write_text(stream, encoding="utf-8", newline="\n")
          PY

          rustfmt --edition 2021 src-tauri/src/dock.rs src-tauri/src/streaming/dock.rs src-tauri/tests/dock_grip_zorder_contract.rs

      - name: Verify GREEN and full Rust suite
        shell: bash
        run: |
          rustfmt --edition 2021 --check src-tauri/src/dock.rs src-tauri/src/streaming/dock.rs src-tauri/tests/dock_grip_zorder_contract.rs
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Commit verified fix
        shell: bash
        run: |
          git clean -fd -- src-tauri/permissions
          rm .github/workflows/fix-dock-divider-z-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/dock.rs src-tauri/src/streaming/dock.rs src-tauri/tests/dock_grip_zorder_contract.rs .github/workflows/fix-dock-divider-z-order.yml
          git commit -m "fix: keep dock dividers below unrelated windows"
          git push origin HEAD:fix/dock-divider-z-order
