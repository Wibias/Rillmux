name: Fix Pointer Clippy

on:
  push:
    branches: ["refactor/streaming-decomposition"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/streaming-decomposition
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Apply exact clippy fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/streaming/windows_layout.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let info_ptr = ptr.cast::<VsFixedFileInfo>();
          let info_addr = info_ptr as usize;
          let buf_start = buf.as_ptr() as usize;
          let Some(buf_end) = buf_start.checked_add(buf.len()) else {
              return None;
          };
          let Some(info_end) = info_addr.checked_add(std::mem::size_of::<VsFixedFileInfo>()) else {
              return None;
          };
          if info_addr < buf_start
              || info_end > buf_end
              || info_addr % std::mem::align_of::<VsFixedFileInfo>() != 0
          {
              return None;
          }
          let info = &*info_ptr;'''
          new = '''        let info_ptr = ptr.cast::<VsFixedFileInfo>();
                  let info_addr = info_ptr as usize;
                  let buf_start = buf.as_ptr() as usize;
                  let buf_end = buf_start.checked_add(buf.len())?;
                  let info_end = info_addr.checked_add(std::mem::size_of::<VsFixedFileInfo>())?;
                  if info_addr < buf_start
                      || info_end > buf_end
                      || !info_addr.is_multiple_of(std::mem::align_of::<VsFixedFileInfo>())
                  {
                      return None;
                  }
                  let info = &*info_ptr;'''
          old = "\n".join(line[8:] if line.startswith("        ") else line for line in old.splitlines())
          new = "\n".join(line[8:] if line.startswith("        ") else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one version-info block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | python -

      - name: Verify native suite
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo check
          cargo test

      - name: Commit verified fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force "src-tauri/permissions" -ErrorAction SilentlyContinue
          Remove-Item -Force ".github/workflows/fix-pointer-clippy.yml"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict clippy for version-info validation"
          git push origin HEAD:refactor/streaming-decomposition
