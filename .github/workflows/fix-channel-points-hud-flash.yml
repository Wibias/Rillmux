name: Fix Channel Points HUD Flash

on:
  push:
    branches: [fix/channel-points-hud-catalog-flash]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/channel-points-hud-catalog-flash
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply HUD geometry transition fix
        shell: python
        run: |
          from pathlib import Path

          geometry = Path('src/lib/streaming/pointsHud.ts')
          source = geometry.read_text(encoding='utf-8')
          marker = '''/** Convert a physical overlay length (HWND pixels) into CSS pixels. */'''
          helper = '''/**
           * Moving a transparent HUD window's origin while resizing can expose a stale
           * WebView2 frame for one compositor tick. Conceal only transitions where the
           * native origin and size both change; ordinary drag/follow movement stays live.
           */
          export function hudGeometryTransitionNeedsConceal(
            current: OverlayRect,
            next: OverlayRect,
          ): boolean {
            const originMoved =
              Math.round(current.x) !== Math.round(next.x) ||
              Math.round(current.y) !== Math.round(next.y);
            const sizeChanged =
              Math.round(current.width) !== Math.round(next.width) ||
              Math.round(current.height) !== Math.round(next.height);
            return originMoved && sizeChanged;
          }

          '''.replace('\n          ', '\n')
          if source.count(marker) != 1:
              raise SystemExit('pointsHud helper marker mismatch')
          geometry.write_text(source.replace(marker, helper + marker, 1), encoding='utf-8', newline='\n')

          tests = Path('src/lib/streaming/pointsHud.test.ts')
          test_source = tests.read_text(encoding='utf-8')
          import_marker = '  hudDragSurfaceRect,\n'
          if test_source.count(import_marker) != 1:
              raise SystemExit('pointsHud test import marker mismatch')
          test_source = test_source.replace(
              import_marker,
              import_marker + '  hudGeometryTransitionNeedsConceal,\n',
              1,
          )
          test_source += '''
          
          describe("HUD geometry transition concealment", () => {
            it("conceals a catalog opening that shifts the native HUD window left", () => {
              const chip = chipRectForPlayer(player, null, 120);
              const closed = overlayRectForHud(chip, null);
              const panel = catalogRectForChip(player, chip, 280, 360);
              const open = overlayRectForHud(chip, panel);
              expect(open.x).toBeLessThan(closed.x);
              expect(hudGeometryTransitionNeedsConceal(closed, open)).toBe(true);
              expect(hudGeometryTransitionNeedsConceal(open, closed)).toBe(true);
            });

            it("does not conceal a resize whose native origin stays fixed", () => {
              const chip = { x: 108, y: 66, width: 120, height: 36 };
              const panel = catalogRectForChip(player, chip, 280, 300);
              const closed = overlayRectForHud(chip, null);
              const open = overlayRectForHud(chip, panel);
              expect(open.x).toBe(closed.x);
              expect(open.y).toBe(closed.y);
              expect(hudGeometryTransitionNeedsConceal(closed, open)).toBe(false);
            });

            it("keeps same-size position changes visible for dragging", () => {
              const current = { x: 700, y: 60, width: 120, height: 36 };
              const next = { ...current, x: 640 };
              expect(hudGeometryTransitionNeedsConceal(current, next)).toBe(false);
            });
          });
          '''.replace('\n          ', '\n')
          tests.write_text(test_source, encoding='utf-8', newline='\n')

          component = Path('src/components/ChannelPointsHud.tsx')
          component_source = component.read_text(encoding='utf-8')
          component_source = component_source.replace(
              '  hudDragSurfaceRect,\n  isPointsHudOverlay,',
              '  hudDragSurfaceRect,\n  hudGeometryTransitionNeedsConceal,\n  isPointsHudOverlay,',
              1,
          )

          old_apply = '''let overlayApplyChain: Promise<void> = Promise.resolve();
          let overlayApplyLatest: OverlayRect | null = null;
          let overlayApplied: OverlayRect | null = null;

          function applyOverlayRect(rect: OverlayRect) {
            overlayApplyLatest = rect;
            overlayApplyChain = overlayApplyChain
              .then(flushOverlayRect)
              .catch(() => undefined);
          }

          async function flushOverlayRect() {
            while (overlayApplyLatest && isTauri()) {
              const rect = overlayApplyLatest;
              overlayApplyLatest = null;
          '''.replace('\n          ', '\n')
          new_apply = '''type OverlayApplyRequest = {
            rect: OverlayRect;
            afterApply?: () => void;
          };

          let overlayApplyChain: Promise<void> = Promise.resolve();
          let overlayApplyLatest: OverlayApplyRequest | null = null;
          let overlayApplied: OverlayRect | null = null;

          function applyOverlayRect(rect: OverlayRect, afterApply?: () => void) {
            overlayApplyLatest = { rect, afterApply };
            overlayApplyChain = overlayApplyChain
              .then(flushOverlayRect)
              .catch(() => undefined);
          }

          async function flushOverlayRect() {
            while (overlayApplyLatest && isTauri()) {
              const request = overlayApplyLatest;
              const rect = request.rect;
              overlayApplyLatest = null;
          '''.replace('\n          ', '\n')
          if component_source.count(old_apply) != 1:
              raise SystemExit('overlay apply header mismatch')
          component_source = component_source.replace(old_apply, new_apply, 1)

          old_size = '''    await win.setPosition(position).catch(() => undefined);
              if (!sizeChanged) continue;
              await win.setSize(size).catch(() => undefined);
              await invoke("overlay_fit_webview", { width, height }).catch(
                () => undefined,
              );
              // Transparent WebView2 often keeps the old child size on the first resize.
              await new Promise<void>((resolve) => {
                requestAnimationFrame(() => resolve());
              });
              await invoke("overlay_fit_webview", { width, height }).catch(
                () => undefined,
              );
              await win.setSize(size).catch(() => undefined);
            }
          }
          '''.replace('\n              ', '\n    ')
          new_size = '''    await win.setPosition(position).catch(() => undefined);
              if (sizeChanged) {
                await win.setSize(size).catch(() => undefined);
                await invoke("overlay_fit_webview", { width, height }).catch(
                  () => undefined,
                );
                // Transparent WebView2 often keeps the old child size on the first resize.
                await new Promise<void>((resolve) => {
                  requestAnimationFrame(() => resolve());
                });
                await invoke("overlay_fit_webview", { width, height }).catch(
                  () => undefined,
                );
                await win.setSize(size).catch(() => undefined);
              }
              request.afterApply?.();
            }
          }
          '''.replace('\n              ', '\n    ')
          if component_source.count(old_size) != 1:
              raise SystemExit('overlay apply tail mismatch')
          component_source = component_source.replace(old_size, new_size, 1)

          state_marker = '  const [catalogOpen, setCatalogOpen] = useState(false);\n'
          if component_source.count(state_marker) != 1:
              raise SystemExit('catalog state marker mismatch')
          component_source = component_source.replace(
              state_marker,
              state_marker + '  const [geometryConcealed, setGeometryConcealed] = useState(false);\n',
              1,
          )

          ref_marker = '  const lastOverlayRef = useRef<OverlayRect | null>(null);\n'
          if component_source.count(ref_marker) != 1:
              raise SystemExit('overlay ref marker mismatch')
          component_source = component_source.replace(
              ref_marker,
              ref_marker + '  const overlayApplyGenerationRef = useRef(0);\n',
              1,
          )

          effect_start = component_source.index('  useEffect(() => {\n    if (!overlay) return;\n', component_source.index('const panelLocal'))
          effect_end_marker = '  }, [overlay]);\n\n  const interactive = chip != null;'
          effect_end = component_source.index(effect_end_marker, effect_start)
          new_effect = '''  useEffect(() => {
            if (!overlay) return;
            if (
              !geometryConcealed &&
              lastOverlayRef.current &&
              !overlayRectMoved(
                lastOverlayRef.current,
                overlay,
                POINTS_HUD_MOVE_SLOP,
              )
            ) {
              return;
            }
            lastOverlayRef.current = overlay;
            const generation = ++overlayApplyGenerationRef.current;
            let firstFrame: number | null = null;
            let secondFrame: number | null = null;
            const apply = () => {
              applyOverlayRect(
                overlay,
                geometryConcealed
                  ? () => {
                      if (overlayApplyGenerationRef.current === generation) {
                        setGeometryConcealed(false);
                      }
                    }
                  : undefined,
              );
            };
            if (!geometryConcealed) {
              apply();
              return;
            }
            // Give WebView2 two compositor ticks to present the transparent
            // concealed frame before moving/resizing the native HWND.
            firstFrame = window.requestAnimationFrame(() => {
              secondFrame = window.requestAnimationFrame(apply);
            });
            return () => {
              if (firstFrame != null) window.cancelAnimationFrame(firstFrame);
              if (secondFrame != null) window.cancelAnimationFrame(secondFrame);
            };
          }, [overlay, geometryConcealed]);

          const interactive = chip != null;'''.replace('\n          ', '\n')
          component_source = (
              component_source[:effect_start]
              + new_effect
              + component_source[effect_end + len(effect_end_marker):]
          )

          transition_marker = '  function cancelDragChipRaf() {\n'
          transition_fn = '''  function setCatalogOpenWithGeometry(nextOpen: boolean) {
            if (nextOpen === catalogOpen) return;
            const nextPanel =
              nextOpen && host && chip
                ? catalogRectForChip(
                    host,
                    chip,
                    POINTS_HUD_CATALOG_MAX_WIDTH,
                    POINTS_HUD_CATALOG_MAX_HEIGHT,
                  )
                : null;
            const nextOverlay = chip ? overlayRectForHud(chip, nextPanel) : null;
            if (
              overlay &&
              nextOverlay &&
              hudGeometryTransitionNeedsConceal(overlay, nextOverlay)
            ) {
              setGeometryConcealed(true);
            }
            setCatalogOpen(nextOpen);
          }

          '''.replace('\n          ', '\n')
          if component_source.count(transition_marker) != 1:
              raise SystemExit('transition insertion marker mismatch')
          component_source = component_source.replace(
              transition_marker,
              transition_fn + transition_marker,
              1,
          )

          drag_marker = '''      drag.dragged = true;
              draggingRef.current = true;
              setCatalogOpen(false);
              setInputFor(null);
          '''.replace('\n              ', '\n      ')
          drag_replacement = drag_marker.replace('setCatalogOpen(false);', 'setCatalogOpenWithGeometry(false);')
          if component_source.count(drag_marker) != 1:
              raise SystemExit('drag close marker mismatch')
          component_source = component_source.replace(drag_marker, drag_replacement, 1)

          click_marker = '''    setDragChip(null);
              setCatalogOpen((open) => !open);
              setInputFor(null);
          '''.replace('\n              ', '\n    ')
          click_replacement = click_marker.replace(
              'setCatalogOpen((open) => !open);',
              'setCatalogOpenWithGeometry(!catalogOpen);',
          )
          if component_source.count(click_marker) != 1:
              raise SystemExit('click toggle marker mismatch')
          component_source = component_source.replace(click_marker, click_replacement, 1)

          style_marker = '''        height: cssPx(overlay.height, scale),
              }}
          '''.replace('\n              ', '\n        ')
          style_replacement = '''        height: cssPx(overlay.height, scale),
              visibility: geometryConcealed ? "hidden" : "visible",
              }}
          '''.replace('\n              ', '\n        ')
          if component_source.count(style_marker) != 1:
              raise SystemExit('root style marker mismatch')
          component_source = component_source.replace(style_marker, style_replacement, 1)
          component.write_text(component_source, encoding='utf-8', newline='\n')
      - name: Verify frontend
        run: |
          npm test
          npm run build
      - name: Commit verified fix
        run: |
          git rm .github/workflows/fix-channel-points-hud-flash.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChannelPointsHud.tsx src/lib/streaming/pointsHud.ts src/lib/streaming/pointsHud.test.ts
          git commit -m "fix: prevent channel points HUD catalog flash"
          git push origin HEAD:fix/channel-points-hud-catalog-flash
