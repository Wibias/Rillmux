name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# New commits on the same PR cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rustfmt streaming shards
        working-directory: src-tauri
        run: >-
          rustfmt --edition 2021 --check
          src/streaming/foundation.rs
          src/streaming/types_player.rs
          src/streaming/tools_process.rs
          src/streaming/dock.rs
          src/streaming/overlays.rs
          src/streaming/windows_layout.rs
          src/streaming/runtime.rs
          src/streaming/tests.rs
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory audit
        working-directory: src-tauri
        run: cargo audit

  ci:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job failed
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            exit 1
          fi
          for result in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
