name: Clean Channel Points HUD Fix

on:
  push:
    branches: [fix/channel-points-hud-catalog-flash]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/channel-points-hud-catalog-flash
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clean formatting without changing behavior
        shell: python
        run: |
          from pathlib import Path

          component = Path('src/components/ChannelPointsHud.tsx')
          source = component.read_text(encoding='utf-8')

          start = source.index('    await win.setPosition(position).catch(() => undefined);')
          end = source.index('\n  }\n}\n\nexport function ChannelPointsHud()', start)
          tail = '''    await win.setPosition(position).catch(() => undefined);
              if (sizeChanged) {
                await win.setSize(size).catch(() => undefined);
                await invoke("overlay_fit_webview", { width, height }).catch(
                  () => undefined,
                );
                // Transparent WebView2 often keeps the old child size on the first resize.
                await new Promise<void>((resolve) => {
                  requestAnimationFrame(() => resolve());
                });
                await invoke("overlay_fit_webview", { width, height }).catch(
                  () => undefined,
                );
                await win.setSize(size).catch(() => undefined);
              }
              request.afterApply?.();'''.replace('\n              ', '\n    ')
          source = source[:start] + tail + source[end:]

          start = source.index('  useEffect(() => {\n  if (!overlay) return;')
          end = source.index('\n  useEffect(() => {\n    if (!isTauri()) return;', start)
          effect = '''  useEffect(() => {
            if (!overlay) return;
            if (
              !geometryConcealed &&
              lastOverlayRef.current &&
              !overlayRectMoved(
                lastOverlayRef.current,
                overlay,
                POINTS_HUD_MOVE_SLOP,
              )
            ) {
              return;
            }
            lastOverlayRef.current = overlay;
            const generation = ++overlayApplyGenerationRef.current;
            let firstFrame: number | null = null;
            let secondFrame: number | null = null;
            const apply = () => {
              applyOverlayRect(
                overlay,
                geometryConcealed
                  ? () => {
                      if (overlayApplyGenerationRef.current === generation) {
                        setGeometryConcealed(false);
                      }
                    }
                  : undefined,
              );
            };
            if (!geometryConcealed) {
              apply();
              return;
            }
            // Let WebView2 present the transparent frame before the HWND moves.
            firstFrame = window.requestAnimationFrame(() => {
              secondFrame = window.requestAnimationFrame(apply);
            });
            return () => {
              if (firstFrame != null) window.cancelAnimationFrame(firstFrame);
              if (secondFrame != null) window.cancelAnimationFrame(secondFrame);
            };
          }, [overlay, geometryConcealed]);

          const interactive = chip != null;'''.replace('\n          ', '\n')
          source = source[:start] + effect + source[end:]

          start = source.index('  function setCatalogOpenWithGeometry(nextOpen: boolean) {')
          end = source.index('\n  function cancelDragChipRaf()', start)
          transition = '''  function setCatalogOpenWithGeometry(nextOpen: boolean) {
            if (nextOpen === catalogOpen) return;
            const nextPanel =
              nextOpen && host && chip
                ? catalogRectForChip(
                    host,
                    chip,
                    POINTS_HUD_CATALOG_MAX_WIDTH,
                    POINTS_HUD_CATALOG_MAX_HEIGHT,
                  )
                : null;
            const nextOverlay = chip ? overlayRectForHud(chip, nextPanel) : null;
            if (
              overlay &&
              nextOverlay &&
              hudGeometryTransitionNeedsConceal(overlay, nextOverlay)
            ) {
              setGeometryConcealed(true);
            }
            setCatalogOpen(nextOpen);
          }
          '''.replace('\n          ', '\n')
          source = source[:start] + transition + source[end:]
          component.write_text(source, encoding='utf-8', newline='\n')

          geometry = Path('src/lib/streaming/pointsHud.ts')
          source = geometry.read_text(encoding='utf-8')
          source = source.replace(
              '''/**
          * Moving a transparent HUD window's origin while resizing can expose a stale
          * WebView2 frame for one compositor tick. Conceal only transitions where the
          * native origin and size both change; ordinary drag/follow movement stays live.
          */'''.replace('\n          ', '\n'),
              '''/**
           * Moving a transparent HUD window's origin while resizing can expose a stale
           * WebView2 frame for one compositor tick. Conceal only transitions where the
           * native origin and size both change; ordinary drag/follow movement stays live.
           */'''.replace('\n           ', '\n * '),
          )
          # Normalize the comment explicitly; the replacement above is deliberately
          # conservative because the source has no formatter dependency.
          source = source.replace(
              "/**\n* Moving a transparent HUD window's origin while resizing can expose a stale\n* WebView2 frame for one compositor tick. Conceal only transitions where the\n* native origin and size both change; ordinary drag/follow movement stays live.\n*/",
              "/**\n * Moving a transparent HUD window's origin while resizing can expose a stale\n * WebView2 frame for one compositor tick. Conceal only transitions where the\n * native origin and size both change; ordinary drag/follow movement stays live.\n */",
          )
          geometry.write_text(source, encoding='utf-8', newline='\n')

          tests = Path('src/lib/streaming/pointsHud.test.ts')
          source = tests.read_text(encoding='utf-8').replace(
              '});\n\n\ndescribe("HUD geometry transition concealment"',
              '});\n\ndescribe("HUD geometry transition concealment"',
          )
          tests.write_text(source, encoding='utf-8', newline='\n')
      - name: Verify frontend
        run: |
          npm test
          npm run build
      - name: Commit cleanup
        run: |
          git rm .github/workflows/format-channel-points-hud-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChannelPointsHud.tsx src/lib/streaming/pointsHud.ts src/lib/streaming/pointsHud.test.ts
          git commit -m "chore: clean channel points HUD transition patch"
          git push origin HEAD:fix/channel-points-hud-catalog-flash
