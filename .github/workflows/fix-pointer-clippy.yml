name: Fix Pointer Clippy

on:
  push:
    branches: ["refactor/streaming-decomposition"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/streaming-decomposition
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Apply exact clippy fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/streaming/windows_layout.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """        let Some(buf_end) = buf_start.checked_add(buf.len()) else {\n            return None;\n        };""",
                  "        let buf_end = buf_start.checked_add(buf.len())?;",
              ),
              (
                  """        let Some(info_end) = info_addr.checked_add(std::mem::size_of::<VsFixedFileInfo>()) else {\n            return None;\n        };""",
                  "        let info_end = info_addr.checked_add(std::mem::size_of::<VsFixedFileInfo>())?;",
              ),
              (
                  "        || info_addr % std::mem::align_of::<VsFixedFileInfo>() != 0",
                  "        || !info_addr.is_multiple_of(std::mem::align_of::<VsFixedFileInfo>())",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one clippy target, found {text.count(old)}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Verify native suite
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo check
          cargo test

      - name: Commit verified fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force "src-tauri/permissions" -ErrorAction SilentlyContinue
          Remove-Item -Force ".github/workflows/fix-pointer-clippy.yml"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict clippy for version-info validation"
          git push origin HEAD:refactor/streaming-decomposition
