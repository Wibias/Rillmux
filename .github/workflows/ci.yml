name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# New commits on the same PR cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rustfmt streaming shards
        working-directory: src-tauri
        run: >-
          rustfmt --edition 2021 --check
          src/streaming/foundation.rs
          src/streaming/types_player.rs
          src/streaming/tools_process.rs
          src/streaming/dock.rs
          src/streaming/overlays.rs
          src/streaming/windows_layout.rs
          src/streaming/runtime.rs
          src/streaming/tests.rs
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory audit
        working-directory: src-tauri
        run: cargo audit

  ci:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job failed
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            exit 1
          fi
          for result in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  apply-rabbit-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/full-repo-review-findings'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply validated CodeRabbit fixes
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(text)

          def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected block missing in {path}: {old.splitlines()[0]}")
              write(path, text.replace(old, new, 1))

          diagnostics = "src-tauri/src/diagnostics.rs"
          replace_once(diagnostics, '''fn rotate_log_if_needed(path: &Path, incoming_bytes: u64) {
              let current = fs::metadata(path)
                  .map(|metadata| metadata.len())
                  .unwrap_or(0);
              if current.saturating_add(incoming_bytes) <= MAX_LOG_BYTES {
                  return;
              }
              let rotated = path.with_file_name("rillmux.log.1");
              let _ = fs::remove_file(&rotated);
              if fs::rename(path, &rotated).is_err() {
                  let _ = fs::remove_file(path);
              }
          }
          ''', '''fn rotate_log_if_needed(path: &Path, incoming_bytes: u64) -> bool {
              let current = fs::metadata(path)
                  .map(|metadata| metadata.len())
                  .unwrap_or(0);
              if current.saturating_add(incoming_bytes) <= MAX_LOG_BYTES {
                  return true;
              }
              let rotated = path.with_file_name("rillmux.log.1");
              let _ = fs::remove_file(&rotated);
              fs::rename(path, &rotated).is_ok()
          }

          fn bounded_log_line(msg: &str) -> String {
              let mut line = format!("{msg}\\n");
              let max = MAX_LOG_BYTES as usize;
              if line.len() <= max {
                  return line;
              }
              let mut end = max.saturating_sub(1);
              while !line.is_char_boundary(end) {
                  end = end.saturating_sub(1);
              }
              line.truncate(end);
              line.push('\\n');
              line
          }
          ''')
          replace_once(diagnostics, '''    let line = format!("{msg}\\n");
          ''', '''    let line = bounded_log_line(msg);
          ''')
          replace_once(diagnostics, '''    rotate_log_if_needed(&path, line.len() as u64);
              if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) {
          ''', '''    if !rotate_log_if_needed(&path, line.len() as u64) {
                  return;
              }
              if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) {
          ''')
          replace_once(diagnostics, '''    #[test]
              fn log_rotation_threshold_is_bounded() {
                  assert_eq!(MAX_LOG_BYTES, 10 * 1024 * 1024);
                  assert!(MAX_LOG_BYTES.saturating_add(1) > MAX_LOG_BYTES);
              }
          ''', '''    #[test]
              fn log_rotation_threshold_is_bounded() {
                  assert_eq!(MAX_LOG_BYTES, 10 * 1024 * 1024);
                  assert!(MAX_LOG_BYTES.saturating_add(1) > MAX_LOG_BYTES);
              }

              #[test]
              fn oversized_log_line_is_bounded_and_utf8_safe() {
                  let msg = "é".repeat((MAX_LOG_BYTES as usize / 2) + 1);
                  let line = bounded_log_line(&msg);
                  assert!(line.len() as u64 <= MAX_LOG_BYTES);
                  assert!(line.ends_with('\\n'));
                  assert!(std::str::from_utf8(line.as_bytes()).is_ok());
              }

              #[test]
              fn failed_rotation_preserves_current_log() {
                  let unique = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  let dir = std::env::temp_dir().join(format!(
                      "rillmux-log-rotation-{}-{unique}",
                      std::process::id()
                  ));
                  fs::create_dir_all(&dir).unwrap();
                  let path = dir.join("rillmux.log");
                  let rotated = dir.join("rillmux.log.1");
                  fs::write(&path, b"history").unwrap();
                  fs::create_dir(&rotated).unwrap();

                  assert!(!rotate_log_if_needed(&path, MAX_LOG_BYTES));
                  assert_eq!(fs::read(&path).unwrap(), b"history");

                  fs::remove_dir_all(&dir).unwrap();
              }
          ''')

          runtime = "src-tauri/src/streaming/runtime.rs"
          replace_once(runtime, '''    let streamlink_auth_config = crate::twitch_web_auth::streamlink_auth_config()
                  .map_err(|error| StreamError::Message(error.to_string()))?;
          ''', '''    let streamlink_auth_config = match crate::twitch_web_auth::streamlink_auth_config() {
                  Ok(config) => config,
                  Err(error) => {
                      close_fast_player(&mut fast_player, false);
                      return Err(StreamError::Message(error.to_string()));
                  }
              };
          ''')

          auth = "src-tauri/src/twitch_web_auth.rs"
          replace_once(auth, '''pub(crate) fn streamlink_auth_config() -> Result<Option<StreamlinkAuthConfig>, TwitchWebAuthError> {
              let Some(token) = load_token()? else {
                  return Ok(None);
              };
              streamlink_auth_config_for(&token).map(Some)
          }
          ''', '''pub(crate) fn streamlink_auth_config() -> Result<Option<StreamlinkAuthConfig>, TwitchWebAuthError> {
              // Streamlink loads plugin-specific config.twitch after a custom --config,
              // so remove only auth blocks managed by Rillmux before every launch.
              remove_streamlink_auth()?;
              let Some(token) = load_token()? else {
                  return Ok(None);
              };
              streamlink_auth_config_for(&token).map(Some)
          }
          ''')
          replace_once(auth, '''fn remove_streamlink_auth() -> Result<PathBuf, TwitchWebAuthError> {
              let path = streamlink_config_path()?;
              let existing = read_config(&path)?;
              if existing.is_empty() {
                  return Ok(path);
              }
              let updated = remove_managed_block(&existing);
              if updated.trim().is_empty() {
                  match std::fs::remove_file(&path) {
                      Ok(()) => {}
                      Err(error) if error.kind() == std::io::ErrorKind::NotFound => {}
                      Err(error) => return Err(error.into()),
                  }
              } else if updated != existing {
                  write_secure(&path, &updated)?;
              }
              Ok(path)
          }
          ''', '''fn remove_streamlink_auth_at(path: &Path) -> Result<(), TwitchWebAuthError> {
              let existing = read_config(path)?;
              if existing.is_empty() {
                  return Ok(());
              }
              let updated = remove_managed_block(&existing);
              if updated.trim().is_empty() {
                  match std::fs::remove_file(path) {
                      Ok(()) => {}
                      Err(error) if error.kind() == std::io::ErrorKind::NotFound => {}
                      Err(error) => return Err(error.into()),
                  }
              } else if updated != existing {
                  write_secure(path, &updated)?;
              }
              Ok(())
          }

          fn remove_streamlink_auth() -> Result<PathBuf, TwitchWebAuthError> {
              let path = streamlink_config_path()?;
              remove_streamlink_auth_at(&path)?;
              Ok(path)
          }
          ''')
          replace_once(auth, '''    #[test]
              fn resolves_platform_config_paths() {
          ''', '''    #[test]
              fn removes_legacy_managed_auth_from_existing_plugin_config() {
                  let dir = std::env::temp_dir().join(format!(
                      "rillmux-streamlink-config-{}-{}",
                      std::process::id(),
                      Uuid::new_v4().simple()
                  ));
                  std::fs::create_dir_all(&dir).unwrap();
                  let path = dir.join("config.twitch");
                  let existing = concat!(
                      "player=mpv\\n\\n",
                      "# BEGIN streamlink-twitch-gui managed Twitch auth\\n",
                      "twitch-api-header=Authorization=OAuth stale-token\\n",
                      "# END streamlink-twitch-gui managed Twitch auth\\n\\n",
                      "retry-streams=1\\n",
                  );
                  std::fs::write(&path, existing).unwrap();

                  remove_streamlink_auth_at(&path).unwrap();
                  let cleaned = std::fs::read_to_string(&path).unwrap();
                  assert_eq!(cleaned, "player=mpv\\n\\nretry-streams=1\\n");
                  assert!(!cleaned.contains("twitch-api-header"));

                  std::fs::remove_dir_all(&dir).unwrap();
              }

              #[test]
              fn resolves_platform_config_paths() {
          ''')
          '@
          $script | python -
      - name: Format touched Rust files
        shell: pwsh
        run: >-
          rustfmt --edition 2021
          src-tauri/src/diagnostics.rs
          src-tauri/src/twitch_web_auth.rs
          src-tauri/src/streaming/runtime.rs
      - name: Commit validated CodeRabbit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/src/diagnostics.rs src-tauri/src/streaming/runtime.rs src-tauri/src/twitch_web_auth.rs
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: address validated CodeRabbit findings"
          git push origin HEAD:fix/full-repo-review-findings
