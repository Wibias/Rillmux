name: Fix PR29 Version Info V2

on:
  push:
    branches: [refactor/streaming-decomposition]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/streaming-decomposition
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Apply no-dereference fix and tests
        shell: python
        run: |
          from pathlib import Path

          layout = Path('src-tauri/src/streaming/windows_layout.rs')
          source = layout.read_text(encoding='utf-8')

          marker = '#[cfg(windows)]\nfn file_product_version(exe: &Path) -> Option<String> {'
          helper = '''const VS_FIXED_FILE_INFO_SIGNATURE: u32 = 0xFEEF04BD;
          const DWORD_BYTES: usize = std::mem::size_of::<u32>();
          const VS_FIXED_FILE_INFO_SIZE: usize = 13 * DWORD_BYTES;
          const PRODUCT_VERSION_MS_OFFSET: usize = 4 * DWORD_BYTES;
          const PRODUCT_VERSION_LS_OFFSET: usize = 5 * DWORD_BYTES;

          fn read_u32_le(bytes: &[u8], offset: usize) -> Option<u32> {
              let end = offset.checked_add(DWORD_BYTES)?;
              let raw: [u8; 4] = bytes.get(offset..end)?.try_into().ok()?;
              Some(u32::from_le_bytes(raw))
          }

          fn fixed_file_product_version(
              buf: &[u8],
              offset: usize,
              reported_len: usize,
          ) -> Option<String> {
              if reported_len < VS_FIXED_FILE_INFO_SIZE {
                  return None;
              }
              let end = offset.checked_add(VS_FIXED_FILE_INFO_SIZE)?;
              let info = buf.get(offset..end)?;
              if read_u32_le(info, 0)? != VS_FIXED_FILE_INFO_SIGNATURE {
                  return None;
              }
              let product_version_ms = read_u32_le(info, PRODUCT_VERSION_MS_OFFSET)?;
              let product_version_ls = read_u32_le(info, PRODUCT_VERSION_LS_OFFSET)?;
              let major = (product_version_ms >> 16) & 0xffff;
              let minor = product_version_ms & 0xffff;
              let patch = (product_version_ls >> 16) & 0xffff;
              let build = product_version_ls & 0xffff;
              if build == 0 {
                  Some(format!("{major}.{minor}.{patch}"))
              } else {
                  Some(format!("{major}.{minor}.{patch}.{build}"))
              }
          }

          #[cfg(windows)]
          fn file_product_version(exe: &Path) -> Option<String> {'''
          if source.count(marker) != 1:
              raise SystemExit('file_product_version marker mismatch')
          source = source.replace(marker, helper, 1)

          struct_block = '''    #[repr(C)]
          struct VsFixedFileInfo {
              signature: u32,
              struc_version: u32,
              file_version_ms: u32,
              file_version_ls: u32,
              product_version_ms: u32,
              product_version_ls: u32,
              file_flags_mask: u32,
              file_flags: u32,
              file_os: u32,
              file_type: u32,
              file_subtype: u32,
              file_date_ms: u32,
              file_date_ls: u32,
          }
          '''
          if source.count(struct_block) != 1:
              raise SystemExit('VsFixedFileInfo struct block mismatch')
          source = source.replace(struct_block, '', 1)

          old = '''        if VerQueryValueW(buf.as_ptr().cast(), sub.as_ptr(), &mut ptr, &mut len) == 0
              || ptr.is_null()
              || (len as usize) < std::mem::size_of::<VsFixedFileInfo>()
          {
              return None;
          }
          let info_ptr = ptr.cast::<VsFixedFileInfo>();
          let info_addr = info_ptr as usize;
          let buf_start = buf.as_ptr() as usize;
          let buf_end = buf_start.checked_add(buf.len())?;
          let info_end = info_addr.checked_add(std::mem::size_of::<VsFixedFileInfo>())?;
          if info_addr < buf_start
              || info_end > buf_end
              || !info_addr.is_multiple_of(std::mem::align_of::<VsFixedFileInfo>())
          {
              return None;
          }
          let info = &*info_ptr;
          let major = (info.product_version_ms >> 16) & 0xffff;
          let minor = info.product_version_ms & 0xffff;
          let patch = (info.product_version_ls >> 16) & 0xffff;
          // Chatterino prints "7.5.5" (3-part); omit build when zero.
          let build = info.product_version_ls & 0xffff;
          if build == 0 {
              Some(format!("{major}.{minor}.{patch}"))
          } else {
              Some(format!("{major}.{minor}.{patch}.{build}"))
          }
          '''
          new = '''        if VerQueryValueW(buf.as_ptr().cast(), sub.as_ptr(), &mut ptr, &mut len) == 0
              || ptr.is_null()
          {
              return None;
          }
          // VerQueryValueW points inside `buf`. Convert that address into an
          // offset, then parse only through safe slice indexing. Never
          // dereference the API-returned raw pointer.
          let buf_start = buf.as_ptr() as usize;
          let offset = (ptr as usize).checked_sub(buf_start)?;
          fixed_file_product_version(&buf, offset, len as usize)
          '''
          if source.count(old) != 1:
              raise SystemExit('version-info dereference block mismatch')
          source = source.replace(old, new, 1)
          layout.write_text(source, encoding='utf-8', newline='\n')

          tests = Path('src-tauri/src/streaming/tests.rs')
          test_source = tests.read_text(encoding='utf-8')
          test_marker = '''    #[test]
          fn opening_stream_is_starting_not_ready() {'''
          test_block = '''    #[test]
          fn fixed_file_product_version_reads_owned_bytes() {
              let mut info = vec![0u8; VS_FIXED_FILE_INFO_SIZE];
              info[0..4].copy_from_slice(&VS_FIXED_FILE_INFO_SIGNATURE.to_le_bytes());
              info[PRODUCT_VERSION_MS_OFFSET..PRODUCT_VERSION_MS_OFFSET + 4]
                  .copy_from_slice(&((7u32 << 16) | 5).to_le_bytes());
              info[PRODUCT_VERSION_LS_OFFSET..PRODUCT_VERSION_LS_OFFSET + 4]
                  .copy_from_slice(&((5u32 << 16) | 2).to_le_bytes());
              assert_eq!(
                  fixed_file_product_version(&info, 0, info.len()).as_deref(),
                  Some("7.5.5.2")
              );
          }

          #[test]
          fn fixed_file_product_version_rejects_foreign_or_short_ranges() {
              let info = vec![0u8; VS_FIXED_FILE_INFO_SIZE];
              assert_eq!(fixed_file_product_version(&info, info.len() + 1, info.len()), None);
              assert_eq!(fixed_file_product_version(&info, 0, VS_FIXED_FILE_INFO_SIZE - 1), None);
          }

          #[test]
          fn opening_stream_is_starting_not_ready() {'''
          if test_source.count(test_marker) != 1:
              raise SystemExit('test insertion marker mismatch')
          test_source = test_source.replace(test_marker, test_block, 1)
          tests.write_text(test_source, encoding='utf-8', newline='\n')

          contract = Path('src-tauri/tests/streaming_decomposition_contract.rs')
          contract_source = contract.read_text(encoding='utf-8')
          old_contract = '''#[test]
          fn win32_version_info_pointer_is_validated_before_dereference() {
              let source = include_str!("../src/streaming/windows_layout.rs");
              let query = source
                  .find("VerQueryValueW")
                  .expect("missing Win32 version-info query");
              let dereference = source[query..]
                  .find("let info = &*info_ptr;")
                  .map(|offset| query + offset)
                  .expect("missing validated VS_FIXEDFILEINFO dereference");
              let guard = &source[query..dereference];

              assert!(guard.contains("checked_add(buf.len())?"));
              assert!(guard.contains("checked_add(std::mem::size_of::<VsFixedFileInfo>())?"));
              assert!(guard.contains("info_addr < buf_start"));
              assert!(guard.contains("info_end > buf_end"));
              assert!(guard.contains("is_multiple_of(std::mem::align_of::<VsFixedFileInfo>())"));
          }
          '''
          new_contract = '''#[test]
          fn win32_version_info_pointer_is_never_dereferenced() {
              let source = include_str!("../src/streaming/windows_layout.rs");
              let query = source
                  .find("VerQueryValueW")
                  .expect("missing Win32 version-info query");
              let tail = &source[query..];

              assert!(!tail.contains("&*info_ptr"));
              assert!(!tail.contains("ptr.cast::<VsFixedFileInfo>()"));
              assert!(tail.contains("(ptr as usize).checked_sub(buf_start)?"));
              assert!(tail.contains("fixed_file_product_version(&buf, offset, len as usize)"));
              assert!(source.contains("let info = buf.get(offset..end)?;"));
          }
          '''
          if contract_source.count(old_contract) != 1:
              raise SystemExit('old version-info contract mismatch')
          contract.write_text(contract_source.replace(old_contract, new_contract, 1), encoding='utf-8', newline='\n')
      - name: Verify Rust suite
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo check
          cargo test
      - name: Commit verified fix
        shell: pwsh
        run: |
          git rm .github/workflows/fix-pr29-version-info.yml .github/workflows/fix-pr29-version-info-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/streaming/windows_layout.rs src-tauri/src/streaming/tests.rs src-tauri/tests/streaming_decomposition_contract.rs
          git commit -m "fix: avoid raw version-info pointer dereference"
          git push origin HEAD:refactor/streaming-decomposition
