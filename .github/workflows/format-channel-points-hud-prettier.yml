name: Format Channel Points HUD Fix

on:
  push:
    branches: [fix/channel-points-hud-catalog-flash]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/channel-points-hud-catalog-flash
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched frontend files
        run: >-
          npx --yes prettier@3.6.2 --write
          src/components/ChannelPointsHud.tsx
          src/lib/streaming/pointsHud.ts
          src/lib/streaming/pointsHud.test.ts
      - name: Verify frontend
        run: |
          npm test
          npm run build
      - name: Commit formatting
        run: |
          git rm .github/workflows/format-channel-points-hud-prettier.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChannelPointsHud.tsx src/lib/streaming/pointsHud.ts src/lib/streaming/pointsHud.test.ts
          git commit -m "chore: format channel points HUD transition fix"
          git push origin HEAD:fix/channel-points-hud-catalog-flash
