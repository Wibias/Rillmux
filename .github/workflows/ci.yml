name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# New commits on the same PR cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rustfmt streaming shards
        working-directory: src-tauri
        run: >-
          rustfmt --edition 2021 --check
          src/streaming/foundation.rs
          src/streaming/types_player.rs
          src/streaming/tools_process.rs
          src/streaming/dock.rs
          src/streaming/overlays.rs
          src/streaming/windows_layout.rs
          src/streaming/runtime.rs
          src/streaming/tests.rs
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory audit
        working-directory: src-tauri
        run: cargo audit

  ci:
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job failed
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            exit 1
          fi
          for result in "${{ needs.frontend.result }}" "${{ needs.rust.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  apply-chatterino-owner-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/full-repo-review-findings' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/full-repo-review-findings
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Apply exact ownership patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src-tauri/src/streaming/foundation.rs",
              '''/// Chatterino's QCommandLineParser exits on unknown flags. Tag the dock
          /// instance with an env var instead of `--rillmux-dock`.
          const CHATTERINO_DOCK_ENV: &str = "RILLMUX_DOCK";

          fn chatterino_dock_appdata() -> PathBuf {
              crate::diagnostics::app_data_dir().join("chatterino-dock")
          }
          ''',
              '''/// Chatterino's QCommandLineParser exits on unknown flags. Bind every
          /// dock process to the Rillmux process that spawned it via an exact owner token.
          const CHATTERINO_DOCK_OWNER_ENV: &str = "RILLMUX_DOCK_OWNER";

          fn chatterino_dock_owner() -> &'static str {
              static OWNER: OnceLock<String> = OnceLock::new();
              OWNER
                  .get_or_init(|| format!("{}-{}", std::process::id(), Uuid::new_v4().simple()))
                  .as_str()
          }

          fn chatterino_dock_appdata() -> PathBuf {
              let folder = if cfg!(debug_assertions) {
                  "chatterino-dock-dev"
              } else {
                  "chatterino-dock"
              };
              let base = crate::diagnostics::app_data_dir().join(folder);
              if cfg!(debug_assertions) {
                  base.join(chatterino_dock_owner())
              } else {
                  base
              }
          }
          ''')

          replace_exact(
              "src-tauri/src/streaming/windows_layout.rs",
              '    cmd.env(CHATTERINO_DOCK_ENV, "1");\n',
              '    cmd.env(CHATTERINO_DOCK_OWNER_ENV, chatterino_dock_owner());\n')

          replace_exact(
              "src-tauri/src/streaming/windows_layout.rs",
              '''#[cfg(windows)]
          fn process_has_dock_env(pid: u32) -> bool {
              let Some(wide) = process_env_block(pid) else {
                  return false;
              };
              let needle: Vec<u16> = format!("{CHATTERINO_DOCK_ENV}=").encode_utf16().collect();
              wide.windows(needle.len()).any(|w| w == needle.as_slice())
          }

          #[cfg(not(windows))]
          fn process_has_dock_env(_pid: u32) -> bool {
              false
          }
          ''',
              '''#[cfg(windows)]
          fn process_has_dock_owner(pid: u32) -> bool {
              let Some(wide) = process_env_block(pid) else {
                  return false;
              };
              let needle: Vec<u16> = format!(
                  "{CHATTERINO_DOCK_OWNER_ENV}={}\\0",
                  chatterino_dock_owner()
              )
              .encode_utf16()
              .collect();
              wide.windows(needle.len()).any(|window| window == needle.as_slice())
          }

          #[cfg(not(windows))]
          fn process_has_dock_owner(_pid: u32) -> bool {
              false
          }
          ''')

          replace_exact(
              "src-tauri/src/streaming/windows_layout.rs",
              '''fn process_is_dock_chatterino(pid: u32) -> bool {
              process_has_dock_env(pid)
                  || process_command_line(pid).is_some_and(|cmd| cmd.contains(CHATTERINO_DOCK_ENV))
                  || process_env_contains(pid, "chatterino-dock")
          }

          #[cfg(windows)]
          fn process_env_contains(pid: u32, needle: &str) -> bool {
              let Some(wide) = process_env_block(pid) else {
                  return false;
              };
              let needle: Vec<u16> = needle.encode_utf16().collect();
              if needle.is_empty() {
                  return false;
              }
              wide.windows(needle.len()).any(|w| w == needle.as_slice())
          }

          #[cfg(not(windows))]
          fn process_env_contains(_pid: u32, _needle: &str) -> bool {
              false
          }
          ''',
              '''fn process_is_dock_chatterino(pid: u32) -> bool {
              process_has_dock_owner(pid)
          }
          ''')

          replace_exact(
              "src-tauri/src/streaming/windows_layout.rs",
              '/// The dock instance is tagged with `RILLMUX_DOCK=1`. Never returns the user\'s own Chatterino.\n',
              '/// Only returns Chatterino carrying this Rillmux process\' exact owner token.\n')

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          marker = "\n  apply-chatterino-owner-fix:\n"
          if marker not in ci_text:
              raise SystemExit("temporary CI job marker missing")
          ci.write_text(ci_text.split(marker, 1)[0] + "\n", encoding="utf-8")
      - name: Verify Chatterino ownership contracts
        working-directory: src-tauri
        shell: pwsh
        run: |
          rustfmt --edition 2021 src/streaming/foundation.rs src/streaming/windows_layout.rs
          rustfmt --edition 2021 --check src/streaming/foundation.rs src/streaming/windows_layout.rs
          cargo test --test chatterino_instance_ownership_contract --test chatterino_spawn_window_contract
      - name: Commit ownership fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src-tauri/src/streaming/foundation.rs src-tauri/src/streaming/windows_layout.rs
          git commit -m "fix: isolate Chatterino ownership per app instance"
          git push origin HEAD:fix/full-repo-review-findings
