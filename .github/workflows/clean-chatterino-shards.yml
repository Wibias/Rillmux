name: Clean Chatterino Shards

on:
  push:
    branches:
      - fix/chatterino-spawn-window-race

permissions:
  contents: write

jobs:
  clean:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/chatterino-spawn-window-race
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target

      - name: Format included streaming shards explicitly
        shell: pwsh
        run: |
          rustfmt --edition 2021 src-tauri/src/streaming/tools_process.rs src-tauri/src/streaming/foundation.rs src-tauri/src/streaming/windows_layout.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustfmt --edition 2021 --check src-tauri/src/streaming/tools_process.rs src-tauri/src/streaming/foundation.rs src-tauri/src/streaming/windows_layout.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows Rust gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --test chatterino_spawn_window_contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit formatting cleanup
        shell: bash
        run: |
          rm .github/workflows/clean-chatterino-shards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/streaming/tools_process.rs src-tauri/src/streaming/foundation.rs src-tauri/src/streaming/windows_layout.rs .github/workflows/clean-chatterino-shards.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Chatterino streaming shards"
          git push origin HEAD:fix/chatterino-spawn-window-race
