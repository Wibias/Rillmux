name: Apply Chatterino Spawn Race Fix

on:
  push:
    branches:
      - fix/chatterino-spawn-window-race

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/chatterino-spawn-window-race
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target

      - name: Apply spawn-state and duplicate-window fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tools = Path("src-tauri/src/streaming/tools_process.rs")
          source = tools.read_text(encoding="utf-8")
          fn_start = source.index("pub fn launch_chatterino_for_channels(")
          fn_end = source.index("\nfn normalize_layout", fn_start)
          function = source[fn_start:fn_end]
          tail_start = function.rindex("    let spawn_epoch = current_chatterino_close_epoch();")
          close = function.rfind("\n}")
          if close <= tail_start:
              raise SystemExit("could not bound Chatterino launch tail")
          replacement = '''    // Publish the expected split before launch: the spawned placement thread
              // can start immediately and must never select the blank notebook using stale state.
              let previous_channels = last.clone();
              if let Ok(mut guard) = last_chatterino_channels().lock() {
                  *guard = list.clone();
              }
              let spawn_epoch = current_chatterino_close_epoch();
              if let Err(error) = launch_chatterino_with_path(&path, &list, true, true) {
                  if let Ok(mut guard) = last_chatterino_channels().lock() {
                      if *guard == list {
                          *guard = previous_channels;
                      }
                  }
                  return Err(error);
              }
              if chatterino_spawn_is_stale(spawn_epoch, current_chatterino_close_epoch()) {
                  close_owned_chatterino();
                  return Ok(path.to_string_lossy().into_owned());
              }
              Ok(path.to_string_lossy().into_owned())
          '''.replace('              ', '')
          function = function[:tail_start] + replacement + function[close:]
          source = source[:fn_start] + function + source[fn_end:]
          tools.write_text(source, encoding="utf-8", newline="\n")

          layout = Path("src-tauri/src/streaming/windows_layout.rs")
          source = layout.read_text(encoding="utf-8")
          fn_start = source.index("fn chatterino_pid_has_split_window(pid: u32) -> bool")
          fn_end = source.index("\n#[cfg(not(windows))]", fn_start)
          function = source[fn_start:fn_end]
          guard = function.index("if channels.is_empty()")
          return_at = function.index("return true;", guard)
          function = function[:return_at] + "return false;" + function[return_at + len("return true;"):]
          source = source[:fn_start] + function + source[fn_end:]
          layout.write_text(source, encoding="utf-8", newline="\n")

          foundation = Path("src-tauri/src/streaming/foundation.rs")
          source = foundation.read_text(encoding="utf-8")
          fn_start = source.index("fn chatterino_should_close_duplicate_main(")
          fn_end = source.index("\n/// `--channels", fn_start)
          function = source[fn_start:fn_end]
          expr = 'title.to_ascii_lowercase().contains("chatterino")'
          expr_at = function.index(expr)
          replacement = '''title.trim().is_empty()
              || title.trim().eq_ignore_ascii_case("Chatterino")'''.replace('          ', '')
          function = function[:expr_at] + replacement + function[expr_at + len(expr):]
          source = source[:fn_start] + function + source[fn_end:]
          foundation.write_text(source, encoding="utf-8", newline="\n")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify Windows Rust gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --test chatterino_spawn_window_contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-chatterino-spawn-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/streaming/tools_process.rs src-tauri/src/streaming/windows_layout.rs src-tauri/src/streaming/foundation.rs src-tauri/tests/chatterino_spawn_window_contract.rs .github/workflows/apply-chatterino-spawn-race-fix.yml
          git diff --cached --check
          git commit -m "fix: eliminate Chatterino spawn window race"
          git push origin HEAD:fix/chatterino-spawn-window-race
