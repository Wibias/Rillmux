name: Clean PR29 Version Info

on:
  push:
    branches: [refactor/streaming-decomposition]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/streaming-decomposition
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Clean inserted shard formatting
        shell: python
        run: |
          from pathlib import Path

          layout = Path('src-tauri/src/streaming/windows_layout.rs')
          source = layout.read_text(encoding='utf-8')
          start = source.index('const VS_FIXED_FILE_INFO_SIGNATURE: u32 = 0xFEEF04BD;')
          end = source.index('#[cfg(windows)]\n#[derive(Clone, Copy, Debug)]', start)
          block = r'''const VS_FIXED_FILE_INFO_SIGNATURE: u32 = 0xFEEF04BD;
          const DWORD_BYTES: usize = std::mem::size_of::<u32>();
          const VS_FIXED_FILE_INFO_SIZE: usize = 13 * DWORD_BYTES;
          const PRODUCT_VERSION_MS_OFFSET: usize = 4 * DWORD_BYTES;
          const PRODUCT_VERSION_LS_OFFSET: usize = 5 * DWORD_BYTES;

          fn read_u32_le(bytes: &[u8], offset: usize) -> Option<u32> {
              let end = offset.checked_add(DWORD_BYTES)?;
              let raw: [u8; 4] = bytes.get(offset..end)?.try_into().ok()?;
              Some(u32::from_le_bytes(raw))
          }

          fn fixed_file_product_version(
              buf: &[u8],
              offset: usize,
              reported_len: usize,
          ) -> Option<String> {
              if reported_len < VS_FIXED_FILE_INFO_SIZE {
                  return None;
              }
              let end = offset.checked_add(VS_FIXED_FILE_INFO_SIZE)?;
              let info = buf.get(offset..end)?;
              if read_u32_le(info, 0)? != VS_FIXED_FILE_INFO_SIGNATURE {
                  return None;
              }
              let product_version_ms = read_u32_le(info, PRODUCT_VERSION_MS_OFFSET)?;
              let product_version_ls = read_u32_le(info, PRODUCT_VERSION_LS_OFFSET)?;
              let major = (product_version_ms >> 16) & 0xffff;
              let minor = product_version_ms & 0xffff;
              let patch = (product_version_ls >> 16) & 0xffff;
              let build = product_version_ls & 0xffff;
              if build == 0 {
                  Some(format!("{major}.{minor}.{patch}"))
              } else {
                  Some(format!("{major}.{minor}.{patch}.{build}"))
              }
          }

          #[cfg(windows)]
          fn file_product_version(exe: &Path) -> Option<String> {
              #[link(name = "version")]
              unsafe extern "system" {
                  fn GetFileVersionInfoSizeW(path: *const u16, handle: *mut u32) -> u32;
                  fn GetFileVersionInfoW(
                      path: *const u16,
                      handle: u32,
                      len: u32,
                      data: *mut core::ffi::c_void,
                  ) -> i32;
                  fn VerQueryValueW(
                      block: *const core::ffi::c_void,
                      sub: *const u16,
                      buf: *mut *mut core::ffi::c_void,
                      len: *mut u32,
                  ) -> i32;
              }
              let wide: Vec<u16> = exe
                  .as_os_str()
                  .encode_wide()
                  .chain(std::iter::once(0))
                  .collect();
              unsafe {
                  let mut dummy = 0u32;
                  let size = GetFileVersionInfoSizeW(wide.as_ptr(), &mut dummy);
                  if size == 0 {
                      return None;
                  }
                  let mut buf = vec![0u8; size as usize];
                  if GetFileVersionInfoW(wide.as_ptr(), 0, size, buf.as_mut_ptr().cast()) == 0 {
                      return None;
                  }
                  let sub: Vec<u16> = "\\".encode_utf16().chain(std::iter::once(0)).collect();
                  let mut ptr: *mut core::ffi::c_void = std::ptr::null_mut();
                  let mut len = 0u32;
                  if VerQueryValueW(buf.as_ptr().cast(), sub.as_ptr(), &mut ptr, &mut len) == 0
                      || ptr.is_null()
                  {
                      return None;
                  }
                  // The API returns an address into `buf`. Use it only to derive
                  // a checked offset, then parse the owned bytes safely.
                  let buf_start = buf.as_ptr() as usize;
                  let offset = (ptr as usize).checked_sub(buf_start)?;
                  fixed_file_product_version(&buf, offset, len as usize)
              }
          }

          '''
          block = block.replace('\n          ', '\n')
          layout.write_text(source[:start] + block + source[end:], encoding='utf-8', newline='\n')

          tests = Path('src-tauri/src/streaming/tests.rs')
          source = tests.read_text(encoding='utf-8')
          start = source.index('    #[test]\nfn fixed_file_product_version_reads_owned_bytes()')
          end = source.index('    #[test]\n    fn opening_stream_is_starting_not_ready()', start)
          block = '''    #[test]
          fn fixed_file_product_version_reads_owned_bytes() {
              let mut info = vec![0u8; VS_FIXED_FILE_INFO_SIZE];
              info[0..4].copy_from_slice(&VS_FIXED_FILE_INFO_SIGNATURE.to_le_bytes());
              info[PRODUCT_VERSION_MS_OFFSET..PRODUCT_VERSION_MS_OFFSET + 4]
                  .copy_from_slice(&((7u32 << 16) | 5).to_le_bytes());
              info[PRODUCT_VERSION_LS_OFFSET..PRODUCT_VERSION_LS_OFFSET + 4]
                  .copy_from_slice(&((5u32 << 16) | 2).to_le_bytes());
              assert_eq!(
                  fixed_file_product_version(&info, 0, info.len()).as_deref(),
                  Some("7.5.5.2")
              );
          }

          #[test]
          fn fixed_file_product_version_rejects_foreign_or_short_ranges() {
              let info = vec![0u8; VS_FIXED_FILE_INFO_SIZE];
              assert_eq!(
                  fixed_file_product_version(&info, info.len() + 1, info.len()),
                  None
              );
              assert_eq!(
                  fixed_file_product_version(&info, 0, VS_FIXED_FILE_INFO_SIZE - 1),
                  None
              );
          }

          '''
          block = block.replace('\n          ', '\n    ')
          tests.write_text(source[:start] + block + source[end:], encoding='utf-8', newline='\n')
      - name: Verify shard formatting and Rust suite
        working-directory: src-tauri
        run: |
          rustfmt --edition 2021 --check src/streaming/windows_layout.rs src/streaming/tests.rs
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo check
          cargo test
      - name: Commit cleanup
        shell: pwsh
        run: |
          git rm .github/workflows/clean-pr29-version-info.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/streaming/windows_layout.rs src-tauri/src/streaming/tests.rs
          git commit -m "chore: clean version-info hardening"
          git push origin HEAD:refactor/streaming-decomposition
