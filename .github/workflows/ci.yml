name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Fails on any high/critical advisory without a documented exception
      # (see scripts/audit-gate.mjs for the allowlist + justifications).
      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory audit
        working-directory: src-tauri
        run: cargo audit
