name: Apply Chatterino Spawn Race Fix

on:
  push:
    branches:
      - fix/chatterino-spawn-window-race

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/chatterino-spawn-window-race
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target

      - name: Apply spawn-state and duplicate-window fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          tools = Path("src-tauri/src/streaming/tools_process.rs")
          replace_once(
              tools,
              '''    let spawn_epoch = current_chatterino_close_epoch();
          launch_chatterino_with_path(&path, &list, true, true)?;
          if chatterino_spawn_is_stale(spawn_epoch, current_chatterino_close_epoch()) {
              close_owned_chatterino();
              return Ok(path.to_string_lossy().into_owned());
          }
          if let Ok(mut guard) = last_chatterino_channels().lock() {
              *guard = list.clone();
          }
          Ok(path.to_string_lossy().into_owned())
          '''.replace('      ', ''),
              '''    // Publish the expected split before launch: the spawned placement thread
          // can start immediately and must never select the blank notebook using stale state.
          let previous_channels = last_chatterino_channels()
              .lock()
              .ok()
              .map(|guard| guard.clone())
              .unwrap_or_default();
          if let Ok(mut guard) = last_chatterino_channels().lock() {
              *guard = list.clone();
          }
          let spawn_epoch = current_chatterino_close_epoch();
          if let Err(error) = launch_chatterino_with_path(&path, &list, true, true) {
              if let Ok(mut guard) = last_chatterino_channels().lock() {
                  *guard = previous_channels;
              }
              return Err(error);
          }
          if chatterino_spawn_is_stale(spawn_epoch, current_chatterino_close_epoch()) {
              close_owned_chatterino();
              return Ok(path.to_string_lossy().into_owned());
          }
          Ok(path.to_string_lossy().into_owned())
          '''.replace('      ', ''),
              "launch ordering",
          )

          layout = Path("src-tauri/src/streaming/windows_layout.rs")
          replace_once(
              layout,
              '''    if channels.is_empty() {
              return true;
          }
          '''.replace('      ', ''),
              '''    if channels.is_empty() {
              return false;
          }
          '''.replace('      ', ''),
              "empty expected channels",
          )

          foundation = Path("src-tauri/src/streaming/foundation.rs")
          replace_once(
              foundation,
              '''    if is_keep || !visible || !have_split || area < 10_000 {
              return false;
          }
          title.to_ascii_lowercase().contains("chatterino")
          '''.replace('      ', ''),
              '''    if is_keep || !visible || !have_split || area < 10_000 {
              return false;
          }
          let title = title.trim();
          title.is_empty() || title.eq_ignore_ascii_case("Chatterino")
          '''.replace('      ', ''),
              "duplicate notebook predicate",
          )
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify Windows Rust gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --test chatterino_spawn_window_contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-chatterino-spawn-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/streaming/tools_process.rs src-tauri/src/streaming/windows_layout.rs src-tauri/src/streaming/foundation.rs src-tauri/tests/chatterino_spawn_window_contract.rs .github/workflows/apply-chatterino-spawn-race-fix.yml
          git diff --cached --check
          git commit -m "fix: eliminate Chatterino spawn window race"
          git push origin HEAD:fix/chatterino-spawn-window-race
