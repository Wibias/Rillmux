name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          prefix-key: release-verify

      - name: Install frontend deps
        run: npm ci --ignore-scripts

      - name: Frontend tests
        run: npm test

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Release backtrace contract
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release --test release_backtrace_contract

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: RustSec advisory audit
        working-directory: src-tauri
        run: cargo audit

  build:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Tag pushes and "Run workflow" from main/master publish a GitHub
      # Release. Dispatch from any other branch still builds artifacts only.
      # action-gh-release creates the tag with GITHUB_TOKEN, which does not
      # retrigger this workflow (no recursive tag-push run).
      - name: Resolve release tag
        id: release
        run: node scripts/resolve-release-tag.mjs

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          prefix-key: release-build

      - name: Install frontend deps
        run: npm ci --ignore-scripts

      - name: Fetch bundled Streamlink
        run: npm run streamlink:fetch

      - name: Verify bundled Streamlink payload
        run: npm run streamlink:verify

      # Network smoke test for the exact playback arguments. Kept to manual
      # dispatches so a live Twitch channel cannot fail a tag release.
      - name: Verify bundled Streamlink playback (online)
        if: github.event_name == 'workflow_dispatch'
        run: npm run streamlink:verify -- --online

      # GitHub Actions rejects `secrets` in `if:` (parse error, workflow shows
      # as the file path instead of "Release"). Gate inside the step instead.
      - name: Import Windows Authenticode certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Write-Host "Authenticode secrets not configured; building unsigned installers"
            return
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim())
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          $thumb = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $cfg = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri/tauri.windows.conf.json" -Value $cfg -Encoding utf8
          Write-Host "Authenticode enabled for thumbprint $thumb"

      - name: Validate release Twitch identity
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TWITCH_CLIENT_ID)) {
            throw "TWITCH_CLIENT_ID must be configured before building a release"
          }

      - name: Build Tauri (NSIS + MSI)
        env:
          RUSTFLAGS: -D warnings
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/tauri.windows.conf.json") {
            npm run tauri -- build --config src-tauri/tauri.windows.conf.json
          } else {
            npm run tauri -- build
          }

      # `tauri build` creates .sig files but not the updater manifest; the
      # endpoint in tauri.conf.json expects releases/latest/download/latest.json.
      - name: Generate updater manifest (latest.json)
        if: steps.release.outputs.publish == 'true'
        run: node scripts/generate-updater-manifest.mjs "${{ steps.release.outputs.tag }}"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/latest.json

  publish:
    needs: [verify, build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-installers
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            installers/*.exe
            installers/*.msi
            installers/*.sig
            installers/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
